[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "engram"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "google-genai>=2.31,<3",
    "python-dotenv>=1.0,<2",
    "pydantic>=2.9,<3",
    "httpx>=0.27,<1",
    "rich>=13,<16",
    "mem0ai>=2.2,<3",
    "mcp>=1.30,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
engram = "engram.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
engram = ["prompts/*.md"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]