[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "engram"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "google-genai",
    "python-dotenv",
    "pydantic",
    "httpx",
    "rich>=13",
    "mem0ai",
]

[project.scripts]
engram = "engram.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
engram = ["prompts/*.md"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]